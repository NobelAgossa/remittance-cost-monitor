sources:
  - name: raw
    description: Tables loaded by the Python ingestion (load jobs, one partition per load).
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'raw') }}"
    tables:
      - name: ecb_fx_rates
        description: >
          ECB euro reference rates, one row per date and currency, partitioned by rate
          date. Values are units of the foreign currency per 1 EUR.
        config: 
          loaded_at_field: rate_date
          freshness: 
            warn_after: {count: 4, period: day}
            error_after: {count: 7, period: day}
      - name: rpw_prices
        description: >
          World Bank RPW prices, one row per corridor, service and quarter, partitioned
          by quarter start date. Loaded manually from quarterly files, so no freshness check.