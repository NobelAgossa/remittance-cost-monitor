# Copy to dbt/profiles.yml (git-ignored), then set the variables in .env:
#   cp dbt/profiles.example.yml dbt/profiles.yml
# Authentication: application default credentials, created by
#   gcloud auth application-default login
remittance_cost_monitor:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"
  outputs:
    dev: &bigquery
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('BQ_STAGING_DATASET', 'staging') }}"
      location: "{{ env_var('BQ_LOCATION') }}"
      threads: 4
      priority: interactive
      job_retries: 1
      job_execution_timeout_seconds: 300
    prod: *bigquery
